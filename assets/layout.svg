<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">首次生成完成自然留白与复古排字</title>
<desc id="desc">把场景、留白与文字一起设计，保留协调的原生构图；文字包含当地语言地名和拍摄日期。</desc>
<rect width="960" height="420" rx="20" fill="#f5f2ea"/>
<g font-family="sans-serif" fill="#344e59">
<text x="48" y="62" font-size="26" font-weight="bold">让留白成为构图的一部分</text>
<text x="48" y="101" font-size="17">首次生成统一设计，不追加固定画框，不例行缩小图文。</text>
<path d="M48 141 H912" stroke="#c9c5b9"/>
<text x="48" y="199" font-size="22" font-weight="bold">01 场景有主旨</text>
<text x="48" y="242" font-size="17">保留关键光色与空间关系</text>
<text x="48" y="276" font-size="17">轮廓随景物起伏与收束</text>
<text x="356" y="199" font-size="22" font-weight="bold">02 留白自然</text>
<text x="356" y="242" font-size="17">四边均有宽松的呼吸带</text>
<text x="356" y="276" font-size="17">主体、颗粒与字仍清楚</text>
<text x="660" y="199" font-size="22" font-weight="bold">03 文字有韵味</text>
<text x="660" y="242" font-size="17">当地语言地名 ＋ 拍摄日期</text>
<text x="660" y="276" font-size="17">复古字形，准确且易读</text>
<text x="48" y="363" font-size="16" fill="#637a6b">只针对贴边、截断或拥挤作修正；保留已经合适的主体尺度与文字大小。</text>
</g></svg>
